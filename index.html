<!DOCTYPE html>
<html lang="ko" style="height: 100%;">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI 챗봇 서비스">
    <title>AI Assistant</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }

      .container {
        width: 100%;
        max-width: 950px;
        height: 100vh;
        max-height: 720px;
        border-radius: 24px;
        overflow: hidden;
        background: white;
        animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 
          0 25px 50px -12px rgba(0, 0, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 24px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.5px;
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        position: relative;
        overflow: hidden;
      }

      .header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
        pointer-events: none;
      }

      .header span {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-icon {
        font-size: 28px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      .chat-wrapper {
        flex: 1;
        overflow: hidden;
        position: relative;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }

      .chat-wrapper::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.05) 50%, transparent 100%);
        z-index: 2;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        background: white;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* 반응형 디자인 */
      @media (max-width: 768px) {
        .container {
          max-height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }

        .header {
          padding: 18px 16px;
          font-size: 20px;
          gap: 10px;
        }

        .header-icon {
          font-size: 24px;
        }

        body {
          padding: 0;
        }
      }

      /* 태블릿 디자인 */
      @media (min-width: 769px) and (max-width: 1024px) {
        .container {
          max-height: 650px;
          border-radius: 20px;
        }
      }

      /* 다크모드 지원 */
      @media (prefers-color-scheme: dark) {
        html, body {
          background: linear-gradient(135deg, #0a0e27 0%, #131c3c 50%, #0a0e27 100%);
        }

        .container {
          background: #1a1f3a;
          box-shadow: 
            0 25px 50px -12px rgba(0, 0, 0, 0.5),
            0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }

        .header {
          background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
          box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
        }

        .chat-wrapper {
          background: linear-gradient(180deg, #1a1f3a 0%, #0f1527 100%);
        }

        iframe {
          background: #1a1f3a;
        }
      }

      /* 성능 최적화 */
      @supports (backdrop-filter: blur(10px)) {
        .container {
          background: rgba(255, 255, 255, 0.95);
          backdrop-filter: blur(10px);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <span>
          <span class="header-icon">🤖</span>
          <span>AI Assistant</span>
        </span>
      </div>
      <div class="chat-wrapper">
        <iframe 
          src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multi..." 
          title="AI 챗봇"
          loading="lazy"
          allow="microphone; camera">
        </iframe>
      </div>
    </div>
  </body>
</html>
